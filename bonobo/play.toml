[player]
speed = 4.3                 # sprinting, blocks per second
melee_reach = 3.0
eye_height = 1.62
dps = { "0" = 3.0, "1" = 12.0, "2" = 18.0, "3" = 24.0 }   # by sword tier: fist, wood/stone, iron, diamond
protection_per_point = 0.04 # armour points from /state (0–20) → fraction of damage removed
shield = 0.15
protection_cap = 0.8
hurt_immunity_s = 0.5       # the game ignores further damage for 10 ticks after a hit: incoming dps has a ceiling

[engage]
horizon_s = 4.0             # how far ahead arrival is predicted, like the fight
evade_blocks = 16.0
wall_in_blocks = 10         # blocks needed to pod (data.POD_BLOCKS: 9 cells + the roof's cap)
wall_in_s = 8.0             # seconds exposed while building the pod
notice_r = 16.0            # how far a hostile mob notices us; beyond it awareness fades over the same distance
follow_p = 0.35            # of a threat's pressure that follows us when we walk away instead of killing it
work_horizon_s = 20.0      # how long we would stay in their reach if we simply carried on working
react_s = 3.0              # a threat further out than this is the next decision's: nothing is owed to it yet
no_go_margin = 2.0         # blocks added to a mob's reach before ordinary planning refuses to route through it
fuse_s = 1.5               # a creeper's fuse: how long we have to be out of its blast
swing_s = 0.625            # a sword's swing refilling (attack speed 1.6/s): one hit per swing
keepoff_risk = 0.05        # of a creeper's blast a hit-and-back-off fight still takes, per hit (a late step back)
eat_s = 1.6                # one bite, and what it heals is regen over the seconds after
eat_heals = 6.0            # health a bite is worth over the horizon, fed and undisturbed (regen from saturation)
golden_heals = 8.0         # a golden apple: health back at once (4) and absorption (4) — the only food that heals now
eat_safe_press = 0.2       # hp/s: below this nothing is reaching us (walled in, left behind) and regen can run
block_s = 0.6              # placing one block in the way
dig_s = 0.9                # digging one block down, out of sight
hide_per_block = 0.45      # of an archer's fire that a block of depth takes out of the line
melee_stop_blocks = 2      # blocks of height or depth that put us out of a walking mob's reach entirely
survive_margin_hp = 1.0    # an answer must leave at least this much health after what it expects to lose while under way
arrow_hp = 6.0             # a fully drawn arrow's damage
bow_hit_p = 0.6            # of full draws that hit a mob at range
shot_s = 1.1               # one full draw and loose (22 ticks)
shape_min_gain = 0.1       # a shape must cut this share of the pressure to be worth offering at all      # of what is coming at us that a block of height or depth takes out of the line
interrupt_ttd_s = 4.0      # perception stops a task only when death is closer than one planning round      # perception interrupts a task when death is this close at the current pressure

[build]
max_prepare_blocks = 12

[water]
surface_s = 4.0            # seconds to swim out from a working depth
reaction_s = 1.5           # perception round, /stop, and the rescue getting under way
air_floor = 120            # ticks: a hard floor under the clock, in case the clock's own inputs are wrong

[plan]
slot_fill_s = 90.0         # seconds of work per inventory slot filled: how fast a bag fills while mining
# The chance the thing is HERE AT ALL before anything has been looked for: a world where half the errands find
# what they went for.
exists_prior = 0.5
seek_prior_s = 300.0       # seconds to find one of something never seen (the column solver)
