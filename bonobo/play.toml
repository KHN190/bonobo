[player]
speed = 4.3                 # sprinting, blocks per second
melee_reach = 3.0
dps = { "0" = 2.0, "1" = 6.0, "2" = 8.0, "3" = 10.0 }   # by sword tier: fist, wood/stone, iron, diamond
protection_per_point = 0.04 # armour points from /state (0–20) → fraction of damage removed
shield = 0.15
protection_cap = 0.8

[engage]
horizon_s = 4.0             # how far ahead arrival is predicted, like the fight
hp_reserve = 8.0            # fight only if the expected damage leaves this much
evade_blocks = 16.0
wall_in_blocks = 9          # blocks needed to pod
wall_in_s = 8.0             # seconds exposed while building the pod
notice_r = 16.0            # how far a hostile mob notices us; beyond it awareness fades over the same distance
follow_p = 0.6             # of a threat's pressure that follows us when we walk away instead of killing it
work_horizon_s = 20.0      # how long we would stay in their reach if we simply carried on working
no_go_margin = 2.0         # blocks added to a mob's reach before ordinary planning refuses to route through it
flee_leaves = 0.35         # a threat walked away from is not gone: this much of its pressure comes back
fuse_s = 1.5               # a creeper's fuse: how long we have to be out of its blast
eat_s = 1.6                # one bite, and what it heals is regen over the seconds after
eat_heals = 6.0            # health a bite is worth over the horizon, fed and undisturbed
shield_s = 0.3             # raising a shield
shield_protects = 0.15     # damage removed while it is up, on top of armour
block_s = 0.6              # placing one block in the way
dig_s = 0.9                # digging one block down, out of sight
hide_per_block = 0.45      # of an archer's fire that a block of height or depth takes out of the line
shape_min_gain = 0.1       # a shape must cut this share of the pressure to be worth offering at all      # of what is coming at us that a block of height or depth takes out of the line
detour_blocks = 8.0        # how far a placed block sends a mob around, where it cannot squeeze past
interrupt_ttd_s = 4.0      # perception stops a task only when death is closer than one planning round      # perception interrupts a task when death is this close at the current pressure

[milestone]
# How long a playthrough may take to reach a milestone, in simulated seconds. Budgets, not measurements: they say
# what "fast enough" means for the offline life test, and they are listed as unmeasured because they are declared
# rather than fitted. Three scripts share them: everything works, the measured failures happen, everything takes
# twice as long — a life that cannot reach a pickaxe under the third is not a life.
pickaxe_s = 900.0          # a stone pickaxe in hand
bed_s = 2400.0             # wool, planks, a bed
rounds = 40                # give up after this many decisions, however the clock stands

[water]
surface_s = 4.0            # seconds to swim out from a working depth
reaction_s = 1.5           # perception round, /stop, and the rescue getting under way
air_floor = 120            # ticks: a hard floor under the clock, in case the clock's own inputs are wrong

[pool]
slot_fill_s = 90.0         # seconds of work per inventory slot filled: how fast a bag fills while mining
portal_trip_s = 180.0      # there and back through a portal: what work in another dimension costs extra
seek_prior_s = 300.0       # seconds to find one of something never seen and never measured. A declared
                           # guess, used ONLY without a sample; one real find replaces it outright — it does not
                           # decay, compound, or grow with failures, because none of those are measurements.
tax_bin = 0.5              # health per second per bin
health_bin = 4.0           # health per bin (two hearts)
food_point_s = 12.0        # seconds of play per point of the food bar
commit_floor_s = 6.0       # what CHANGING YOUR MIND costs: re-planning, walking off the old route, dropping
                           # what was in hand. No commitment may be shorter, however cheap the step looks —
                           # a step estimated at 0 s ("seek 1× stone, already here") expired the moment it was
                           # made, so the same decision was re-taken every tick and the same refusal logged
                           # a hundred times in twenty seconds.
