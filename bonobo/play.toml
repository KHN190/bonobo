[player]
melee_reach = 3.0
eye_height = 1.62
shield = 0.15
protection_cap = 0.8
pickup_r = 1.0              # the game picks an item up within one block of the body (the box grown by 1): a kill's drops are that much short of a walk away
hurt_immunity_s = 0.5       # the game ignores further damage for 10 ticks after a hit: incoming dps has a ceiling

[engage]
horizon_s = 4.0             # [policy] how far ahead arrival is predicted, like the fight
evade_blocks = 16.0   # [policy]
wall_in_blocks = 10         # [game] blocks needed to pod (data.POD_BLOCKS: 9 cells + the roof's cap)
wall_in_s = 8.0             # [prior] seconds exposed while building the pod
notice_r = 16.0            # [prior] how far a hostile mob notices us; beyond it awareness fades over the same distance
follow_p = 0.35            # [prior] of a threat's pressure that follows us when we walk away instead of killing it
work_horizon_s = 20.0      # [policy] how long we would stay in their reach if we simply carried on working
react_s = 3.0              # [policy] a threat further out than this is the next decision's: nothing is owed to it yet
no_go_margin = 2.0         # [policy] blocks added to a mob's reach before ordinary planning refuses to route through it
fight_line_q = 0.9         # [policy] an optional fight starts only with this quantile of its health loss to spare (S5)
keepoff_risk = 0.05        # [prior] of a creeper's blast a hit-and-back-off fight still takes, per hit (a late step back)
shield_arrow_block = 0.0   # [prior] of the arrows met while chasing an archer the raised shield stops: 0 until the jar holds it up
eat_s = 1.6                # [game] one bite, and what it heals is regen over the seconds after
eat_heals = 6.0            # [prior] health a bite is worth over the horizon, fed and undisturbed (regen from saturation)
golden_heals = 8.0         # [game] a golden apple: health back at once (4) and absorption (4) — the only food that heals now
eat_safe_press = 0.2       # [policy] hp/s: below this nothing is reaching us (walled in, left behind) and regen can run
block_s = 0.6              # [prior] placing one block in the way
dig_s = 0.9                # [prior] digging one block down, out of sight
hide_per_block = 0.45      # [prior] of an archer's fire that a block of depth takes out of the line
melee_stop_blocks = 2      # [game] blocks of height or depth that put us out of a walking mob's reach entirely
survive_margin_hp = 1.0    # [policy] an answer must leave at least this much health after what it expects to lose while under way
arrow_hp = 6.0             # [game] a fully drawn arrow's damage
bow_hit_p = 0.6            # [prior] of full draws that hit a mob at range
shot_s = 1.1               # [game] one full draw and loose (22 ticks)
shape_min_gain = 0.1       # [policy] a shape must cut this share of the pressure to be worth offering at all      # of what is coming at us that a block of height or depth takes out of the line
interrupt_ttd_s = 4.0      # [policy] perception stops a task only when death is closer than one planning round      # perception interrupts a task when death is this close at the current pressure

[build]
max_prepare_blocks = 12

[water]
surface_s = 4.0            # [prior] seconds to swim out from a working depth
reaction_s = 1.5           # [prior] perception round, /stop, and the rescue getting under way
air_floor = 120            # [policy] ticks: a hard floor under the clock, in case the clock's own inputs are wrong

[plan]
slot_fill_s = 90.0         # [prior] seconds of work per inventory slot filled: how fast a bag fills while mining
# The chance the thing is HERE AT ALL before anything has been looked for: a world where half the errands find
# what they went for.
exists_prior = 0.5   # [prior]
seek_prior_s = 300.0       # [prior] seconds to find one of something never seen (the column solver)
