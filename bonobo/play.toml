[memory]
# A note gets dearer as it ages; it never stops being a note. A cutoff cannot tell "the sheep wandered off" from
# "there were never sheep there", and throwing the note away at thirty minutes is what made the agent explore past
# a field it had mapped the night before. Cost in seconds, growing with the LOGARITHM of age, so a day-old note is
# dearer than an hour-old one by a few doublings — never by infinity, never to zero worth.
fresh_s = 600.0            # age at which a note has taken its first doubling's worth of drift
drift_s_per_log2 = 25.0    # seconds added per doubling of (1 + age / fresh_s)
# How fast a note stops being TRUE, as a half-life. A block stays where it is until somebody takes it; an animal
# walks away, despawns, or is eaten by something else. Same note, two different chances of still being right.
block_half_life_s = 3600.0
mob_half_life_s = 240.0

[build]
max_prepare_blocks = 12

[batch]
# How much a step actually takes is a margin, not a number: one more unit is worth its shadow price (what the
# round's own solve says another one saves) and costs the seconds to pick it up plus the slot it eats
# (`actions.slot_cost_s`, from `pool.slot_fill_s`). Stone and logs, which half of every plan passes through, come
# back by the stack; gold nothing asks for comes back in the quantity that was planned.
pick_s = 0.35              # seconds to pick up one more item once it is broken and we are standing there

[nav]
unit_s = 0.5               # seconds per move unit
probe_r = 14               # blocks: how far from the body a target is priced by route search rather than by the
                           # straight line. Beyond this the box to fetch is too big to be worth a query. Zero
                           # switches route pricing OFF entirely — which is how a bed behind a lava sheet came to
                           # cost exactly what a bed on flat ground costs.

[water]
surface_s = 4.0            # seconds to swim out from a working depth
reaction_s = 1.5           # perception round, /stop, and the rescue getting under way
air_floor = 120            # ticks: a hard floor under the clock, in case the clock's own inputs are wrong

[pool]
# How much planning one round may do, and how it is spent. Planning every candidate to the end, every round, is
# what put a thousand look-ahead lines a minute in the log and left the body waiting — while the answer barely
# moved from round to round. Instead: a fixed budget per round, spent on candidates drawn BY WEIGHT (their worth
# in seconds), keeping what was worked out last time for the ones not drawn. The estimate improves round by round
# instead of being rebuilt from nothing; the choice is always the best of what is known so far.
plans_per_round = 4          # candidates planned in full each round (the rest keep their last plan)
plan_sample_floor = 0.15     # weight every candidate keeps however poor, so nothing is never looked at again
plan_stale_s = 30.0          # a kept plan older than this is refreshed before it is trusted
# How much better a challenger must be before the body changes its mind, ON TOP of what switching costs in
# seconds (the walk, and redoing the piece of work in hand). A pure number, because it is not a fact about the
# world but a taste: how much thrash is worth how much responsiveness. 0 = switch on any improvement.
stickiness = 0.10
# Which threats count as "on us" for the premise a plan is held under. Not every mob the threat model can see
# within its 20 s account: a zombie sixty blocks away arrives in fourteen seconds and changes nothing about
# whether this plan is still the right one. What matters is what can reach us inside a piece of work.
premise_reach_s = 6.0
unmodelled = []   # empty: every candidate is priced in seconds.
slot_fill_s = 90.0         # seconds of work per inventory slot filled: how fast a bag fills while mining
portal_trip_s = 180.0      # there and back through a portal: what work in another dimension costs extra
# The chance the thing is HERE AT ALL before anything has been looked for: a world where half the errands find
# what they went for. Measurement replaces it per kind (`memory.exists_rate`), which is what stops the planner
# pricing "find wool" the same in a forest and in a desert.
exists_prior = 0.5
seek_prior_s = 300.0       # seconds to find one of something never seen and never measured. A declared
                           # guess, used ONLY without a sample; one real find replaces it outright — it does not
                           # decay, compound, or grow with failures, because none of those are measurements.
tax_bin = 0.5              # health per second per bin
health_bin = 4.0           # health per bin (two hearts)
food_point_s = 12.0        # seconds of play per point of the food bar
commit_floor_s = 6.0       # what CHANGING YOUR MIND costs: re-planning, walking off the old route, dropping
                           # what was in hand. No commitment may be shorter, however cheap the step looks —
                           # a step estimated at 0 s ("seek 1× stone, already here") expired the moment it was
                           # made, so the same decision was re-taken every tick and the same refusal logged
                           # a hundred times in twenty seconds.
