[time]
night_s = 420.0            # [game] a Minecraft night, real seconds
day_s = 600.0   # [game]
death_cost_s = 240.0       # [prior] respawn, walk back, re-gear: what a death costs the run in time

[risk]
# p(death) per night by how the night is spent. Sleeping skips it entirely.
night_open = 0.35          # on the surface, no shelter, no bed
night_sheltered = 0.03     # walled in or underground
# Extra p(death) per night without a weapon / per hunt without one.
no_sword_night = 0.10
# Starvation: below this food level nothing sprints or regenerates; the run slows and every hit sticks.
bag_comfortable = 8        # free slots below which mining starts throwing away what it digs
food_low = 6
food_full = 20             # the bar; below it work is slower, below `food_low` nothing sprints or heals
hunger_slowdown = 0.25     # fraction of working time lost at an empty bar, scaled by how empty it is
meal_share_of_day = 0.25   # how long a hunger level is carried before there is a chance to eat
starving_slowdown = 0.5    # fraction of working time lost while low on food
starving_death = 0.15      # p(death) per day at low food with no food carried
# Dark workplaces spawn mobs; torches remove that for the work site.
dark_work_death = 0.05     # p(death) per working session with no torches
encounters_per_day = 3.0
reference_mob = "minecraft:zombie"   # what "a hostile" means when pricing a day
regen_s_per_hp = 4.0                 # seconds to regenerate one health, fed and undisturbed
food_drain_s = 80.0                  # seconds of ordinary activity per point of the food bar
hurt_decay = 0.7
# A bed only skips the night where we can actually sleep: in the open, mobs interrupt it.
night_bed_open = 0.08
phantom_night_death = 0.10           # phantoms after three sleepless nights

[tools]
mine_time_no_pickaxe = 4.0
mine_time_stone = 1.5
mine_time_iron = 1.0
mining_share_of_day = 0.4  # how much of a day is spent mining or digging
use_order = [["pickaxe"], ["axe", "sword"], ["shovel", "hoe"]]  # most used first: scarce material goes there first


[mobs]
# `speed` here is how fast one CLOSES on us, not its walking speed in the wiki: a mob that pursues is faster than
# a mob that wanders, and `arrival_s` is about pursuit. Measured by the arena (`bench/combat.jsonl`) for the two
# families it has fought so far — walkers and archers — and still a declared guess for the rest.
# behaviour only: the game's hp, hit, cadence and melee reach are game.py's (Normal difficulty).
"minecraft:zombie" = { notice_r = 35.0, keep_out = 3.0, speed = 4 }   # [measured]
